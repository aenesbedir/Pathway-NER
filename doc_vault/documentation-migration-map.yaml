# Documentation migration map — Pathway-NER -> doc_vault
#
# One record per Markdown file tracked in the repository, excluding doc_vault/ itself.
# Inventory taken with:
#   rg --files -g '*.md' -g '*.mdx' -g '*.markdown' -g '!doc_vault/**'
#
# action values:
#   KEEP      stays where it is, next to the code it documents
#   INGEST    captured as a source; synthesis notes are created in the vault
#   SPLIT     operational half stays in the repo, knowledge half moves to vault notes
#   GENERATED script output; never moved, only referenced
#   ARCHIVE   historical handoff or superseded document

schema: pathway-ner.documentation-migration-map.v1
